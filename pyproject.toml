[project]
name = "rag"
version = "0.1.0"
description = "RAG question answering over Simple English Wikipedia"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "pyarrow>=17",
    "tiktoken>=0.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.13",
]

[project.scripts]
rag = "rag.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["db: requires a running Postgres (docker compose up -d db)"]

[tool.ruff]
line-length = 100
